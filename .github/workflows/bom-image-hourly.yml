name: Hourly BoM image snapshot

on:
  schedule:
    - cron: "0 * * * *" # hourly (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bom-image-hourly
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if image exists (FTP HEAD)
        id: check
        shell: bash
        run: |
          set -euo pipefail
          URL="ftp://ftp.bom.gov.au/anon/gen/fwo/IDQ65001.png"

          if curl --silent --fail --head "$URL" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "File exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "File missing/unreachable."
          fi

      - name: Stop if file does not exist
        if: steps.check.outputs.exists == 'false'
        shell: bash
        run: |
          echo "Stopping run: source file does not exist."
          exit 0

      - name: Download snapshot
        if: steps.check.outputs.exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p snapshots

          ts="$(date -u '+%Y-%m-%d_%H-%M')"
          out="snapshots/IDQ65001_${ts}.png"

          curl -fL --retry 5 --retry-delay 5 \
            "ftp://ftp.bom.gov.au/anon/gen/fwo/IDQ65001.png" \
            -o "$out"

          echo "Saved: $out"

      - name: Commit & push snapshot
        if: steps.check.outputs.exists == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add snapshots/*.png

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Add BoM IDQ65001 snapshot ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git push
